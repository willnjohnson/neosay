[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neosay"
version = "0.1.0"
description = "cowsay/ponysay, but an 8-bit Neopet says it"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0"]

[project.scripts]
neosay = "neosay.cli:entry"

[tool.setuptools]
packages = ["neosay"]

[tool.setuptools.package-data]
neosay = ["data/*.rgbz"]
